<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodega Medina - Inventario & Pedidos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="selectCategory('Inicio')">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
                    M
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-slate-900">Bodega Medina</h1>
                    <span class="text-xs text-emerald-600 font-medium flex items-center gap-1 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Abierto
                    </span>
                </div>
            </div>

            <button onclick="toggleCart()" class="relative p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 transition text-slate-700">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-blue-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-gradient-to-br from-blue-900 via-blue-800 to-teal-800 text-white py-10 px-4">
        <div class="max-w-4xl mx-auto text-center space-y-3">
            <span class="bg-white/10 text-cyan-200 text-xs font-semibold px-3 py-1 rounded-full border border-white/20">
                Atención rápida por WhatsApp
            </span>
            <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight">
                Calidad y frescura para tu hogar
            </h2>
            <p class="text-blue-100 text-xs sm:text-sm max-w-xl mx-auto">
                Selecciona tus artículos del inventario y envía tu pedido directamente a nuestra caja.
            </p>
        </div>
    </section>

    <!-- Navigation Tabs & Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Category Navigation Tabs -->
        <div class="border-b border-slate-200 mb-6">
            <nav class="flex gap-2 overflow-x-auto pb-px scrollbar-none" id="tabs-container">
                <!-- Navigation tabs dynamically injected here -->
            </nav>
        </div>

        <!-- Search Input -->
        <div class="relative max-w-md mb-8">
            <i data-lucide="search" class="absolute left-3.5 top-3.5 w-5 h-5 text-slate-400"></i>
            <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar producto..." 
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-sm">
        </div>

        <!-- Catalog Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dynamic Product Cards -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 pointer-events-none transition-opacity duration-300 opacity-0">
        <div onclick="toggleCart()" class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl pointer-events-auto flex flex-col">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <div class="flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-blue-600"></i>
                    <h3 class="font-bold text-slate-900">Tu Pedido</h3>
                </div>
                <button onclick="toggleCart()" class="p-2 rounded-lg text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-3">
                <!-- Cart Items Dynamic -->
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                <div class="flex justify-between items-center text-lg font-bold text-slate-900">
                    <span>Total estimado:</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre para la entrega:</label>
                    <input type="text" id="customer-name" placeholder="Tu nombre" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 transition">
                    <i data-lucide="message-circle" class="w-5 h-5"></i>
                    Enviar pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // Listado de Productos del Inventario
        const products = [
            // Víveres
            { id: 1, name: "Harina de Maíz PAN 1kg", price: 1.20, category: "Víveres", icon: "box" },
            { id: 2, name: "Arroz Mary Blanco 1kg", price: 1.10, category: "Víveres", icon: "box" },
            { id: 3, name: "Aceite Vegetal 1L", price: 2.50, category: "Víveres", icon: "box" },
            { id: 4, name: "Pasta Plumas 500g", price: 0.95, category: "Víveres", icon: "box" },
            { id: 19, name: "Sal 1kg", price: 0.45, category: "Víveres", icon: "box" },

            // Pan
            { id: 11, name: "Pan Sobado (Bolsa)", price: 1.50, category: "Pan", icon: "sandwich" },
            { id: 12, name: "Pan Campesino Grande", price: 1.80, category: "Pan", icon: "sandwich" },
            { id: 13, name: "Pan de Sándwich", price: 2.20, category: "Pan", icon: "sandwich" },

            // Charcutería
            { id: 5, name: "Queso Blanco Duro (kg)", price: 5.50, category: "Charcutería", icon: "beef" },
            { id: 6, name: "Jamón de Espalda (kg)", price: 7.20, category: "Charcutería", icon: "beef" },
            { id: 7, name: "Salchichas Paquete", price: 2.10, category: "Charcutería", icon: "beef" },

            // Chucherías
            { id: 20, name: "Caramelos Freegels", price: 0.50, category: "Chucherías", icon: "cookie" },
            { id: 21, name: "Galletas TAM", price: 0.66, category: "Chucherías", icon: "cookie" },
            { id: 22, name: "Caramelos de Menta", price: 0.05, category: "Chucherías", icon: "cookie" },
            { id: 23, name: "Caramelos Chaos Mora", price: 0.06, category: "Chucherías", icon: "cookie" },
            { id: 24, name: "Chupetas", price: 0.25, category: "Chucherías", icon: "cookie" },
            { id: 15, name: "Papas Fritas Lay's", price: 1.00, category: "Chucherías", icon: "cookie" },

            // Bebidas
            { id: 25, name: "Refresco Coca-Cola 355ml", price: 0.70, category: "Bebidas", icon: "cup-soda" },
            { id: 26, name: "Refresco de Litro 1L", price: 1.10, category: "Bebidas", icon: "cup-soda" },
            { id: 27, name: "Refresco Botella 1.25L", price: 1.00, category: "Bebidas", icon: "cup-soda" },
            { id: 28, name: "Refresco 1.5L", price: 1.40, category: "Bebidas", icon: "cup-soda" },
            { id: 29, name: "Refresco 2L", price: 1.80, category: "Bebidas", icon: "cup-soda" },

            // Hogar / Varios
            { id: 30, name: "Toallines Alisoft", price: 0.90, category: "Hogar", icon: "home" },
            { id: 31, name: "Servilletas (Paquete)", price: 0.85, category: "Hogar", icon: "home" },
            { id: 32, name: "Toallas Sanitarias", price: 0.85, category: "Hogar", icon: "home" },
            { id: 33, name: "Vasos Plásticos Desechables", price: 0.06, category: "Hogar", icon: "home" },
            { id: 34, name: "Yesquero / Encendedor", price: 0.25, category: "Hogar", icon: "flame" }
        ];

        // Navegación de Pestañas
        const tabs = [
            { id: "Inicio", label: "Inicio", icon: "home", type: "category" },
            { id: "Víveres", label: "Víveres", icon: "shopping-bag", type: "category" },
            { id: "Pan", label: "Pan", icon: "sandwich", type: "category" },
            { id: "Charcutería", label: "Charcutería", icon: "beef", type: "category" },
            { id: "Chucherías", label: "Chucherías", icon: "cookie", type: "category" },
            { id: "Bebidas", label: "Bebidas", icon: "cup-soda", type: "category" },
            { id: "Hogar", label: "Hogar / Varios", icon: "sparkles", type: "category" },
            { id: "Agua", label: "Agua Potable", icon: "droplet", type: "coming_soon" }
        ];

        let activeTab = "Inicio";
        let cart = [];

        function init() {
            renderTabs();
            filterProducts();
            lucide.createIcons();
        }

        function renderTabs() {
            const container = document.getElementById("tabs-container");
            container.innerHTML = tabs.map(tab => {
                if (tab.type === "coming_soon") {
                    return `
                        <div class="flex items-center gap-2 px-4 py-3 border-b-2 border-transparent text-slate-400 cursor-not-allowed select-none transition opacity-75">
                            <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                            <span class="font-medium text-sm whitespace-nowrap">${tab.label}</span>
                            <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-200 uppercase tracking-wider">
                                Próximamente
                            </span>
                        </div>
                    `;
                }

                const isActive = activeTab === tab.id;
                return `
                    <button onclick="selectCategory('${tab.id}')" 
                        class="flex items-center gap-2 px-4 py-3 border-b-2 font-semibold text-sm whitespace-nowrap transition ${
                            isActive 
                            ? 'border-blue-600 text-blue-600 bg-blue-50/50 rounded-t-lg' 
                            : 'border-transparent text-slate-600 hover:text-slate-900 hover:border-slate-300'
                        }">
                        <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                        ${tab.label}
                    </button>
                `;
            }).join("");
            lucide.createIcons();
        }

        function selectCategory(tabId) {
            activeTab = tabId;
            document.getElementById("search-input").value = "";
            renderTabs();
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query);
                const matchesCategory = activeTab === "Inicio" || p.category === activeTab;
                return matchesSearch && matchesCategory;
            });
            renderProducts(filtered);
        }

        function renderProducts(items) {
            const grid = document.getElementById("products-grid");
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-200/80 p-6">
                        <i data-lucide="package-open" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                        <p class="text-slate-500 font-medium">No hay productos en esta categoría por el momento.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = items.map(p => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                            <i data-lucide="${p.icon}" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg">${p.category}</span>
                    </div>
                    <div>
                        <h3 class="font-semibold text-slate-900">${p.name}</h3>
                        <p class="text-lg font-bold text-blue-600 mt-1">$${p.price.toFixed(2)}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl transition flex items-center justify-center gap-2 text-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i> Agregar
                    </button>
                </div>
            `).join("");
            lucide.createIcons();
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const item = cart.find(c => c.id === productId);
            if (item) {
                item.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById("cart-badge");
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            badge.innerText = totalItems;
            badge.classList.toggle("hidden", totalItems === 0);

            const container = document.getElementById("cart-items");
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm">El carrito está vacío</p>`;
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <div>
                            <p class="font-semibold text-slate-800 text-sm">${item.name}</p>
                            <p class="text-xs text-slate-500">$${item.price.toFixed(2)} c/u</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${item.id}, -1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 flex items-center justify-center font-bold text-slate-600">-</button>
                            <span class="text-sm font-bold w-4 text-center">${item.quantity}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 flex items-center justify-center font-bold text-slate-600">+</button>
                        </div>
                    </div>
                `).join("");
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById("cart-total").innerText = `$${total.toFixed(2)}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCartUI();
        }

        function toggleCart() {
            const drawer = document.getElementById("cart-drawer");
            drawer.classList.toggle("opacity-0");
            drawer.classList.toggle("pointer-events-none");
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("Agrega productos al carrito antes de pedir.");
                return;
            }
            const name = document.getElementById("customer-name").value.trim() || "Cliente";
            let text = `Hola *Bodega Medina*, mi nombre es *${name}* y quiero hacer el siguiente pedido:\n\n`;
            cart.forEach(item => {
                text += `• ${item.quantity}x ${item.name} ($${(item.price * item.quantity).toFixed(2)})\n`;
            });
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            text += `\n*Total a pagar:* $${total.toFixed(2)}`;

            const phone = "584120000000"; // Reemplaza por tu número real de WhatsApp
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, "_blank");
        }

        window.onload = init;
    </script>
</body>
</html>
